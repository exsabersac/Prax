# 我的小镇 M5f F01：默认 Dockerfile.runtime（宿主二进制 → web/bin/）
# 用法：
#   stack build prax:exe:prax-web-session
#   mkdir -p web/bin && cp "$(stack path --local-install-root)/bin/prax-web-session" web/bin/
#   cd web && docker compose up --build
# Session 契约不动。全量 stack 镜像见 web/Dockerfile（后置可选）。
services:
  my-town:
    build:
      context: ..
      dockerfile: web/Dockerfile.runtime
    ports:
      - "${PORT:-8080}:8080"
    environment:
      HOST: "0.0.0.0"
      PORT: "8080"
      PRAX_WEB_SESSION: /usr/local/bin/prax-web-session
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health').read()",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
